{% load static %}
{% load humanize %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký Đối tác - Quỹ Nhân Ái</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary-950: #0a1628; --primary-900: #0f2044; --primary-800: #1e3a8a;
            --primary-700: #2a4fa3; --primary-600: #3b6ac7; --primary-500: #4f84e0;
            --primary-100: #e8f1fe; --primary-50: #f3f7ff;
            --accent-600: #ea580c; --accent-500: #f97316;
            --success-600: #16a34a; --success-100: #f0fdf4;
            --danger-600: #dc2626; --danger-100: #fef2f2;
            --warning-600: #ca8a04; --warning-100: #fefce8;
            --neutral-900: #111827; --neutral-700: #374151; --neutral-500: #6b7280;
            --neutral-400: #9ca3af; --neutral-100: #f9fafb;
            --white: #ffffff;
            --radius-md: 10px; --radius-lg: 16px;
            --shadow-lg: 0 10px 25px rgba(15, 32, 68, 0.12);
            --shadow-btn: 0 4px 14px rgba(30, 58, 138, 0.25);
        }
        body {
            background: linear-gradient(135deg, var(--primary-50) 0%, var(--primary-100) 100%);
            font-family: 'Be Vietnam Pro', sans-serif;
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px;
        }
        .auth-card {
            background: var(--white); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
            border: 1px solid var(--primary-100); width: 100%; max-width: 500px; padding: 40px;
            position: relative; overflow: hidden;
        }
        .auth-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, var(--primary-800), var(--accent-500)); }
        .auth-header { text-align: center; margin-bottom: 32px; }
        .auth-logo { color: var(--primary-800); margin-bottom: 16px; }
        .auth-header h2 { color: var(--primary-950); font-weight: 800; font-size: 24px; margin-bottom: 8px; }
        .auth-header p { color: var(--neutral-500); font-size: 14px; }
        .form-label { font-size: 12px; font-weight: 800; color: var(--neutral-700); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; display: block; }
        .form-control { padding: 10px 16px; border-radius: var(--radius-md); border: 1.5px solid var(--primary-100); background: var(--neutral-100); transition: 0.2s; font-size: 14.5px; }
        .form-control:focus { outline: none; border-color: var(--primary-600); background: var(--white); box-shadow: 0 0 0 4px var(--primary-100); }
        .btn-submit { background: var(--primary-800); color: white; border: none; border-radius: var(--radius-md); padding: 14px; width: 100%; font-weight: 700; margin-top: 15px; box-shadow: var(--shadow-btn); transition: 0.3s; }
        .btn-submit:hover { background: var(--primary-900); transform: translateY(-1px); }
        .msg-box { padding: 12px 16px; border-radius: var(--radius-md); margin-bottom: 20px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .auth-footer { text-align: center; margin-top: 32px; font-size: 14px; color: var(--neutral-500); }
        .auth-footer a { color: var(--primary-700); font-weight: 700; text-decoration: none; }
        .error-msg { color: var(--danger-600); font-size: 11px; font-weight: 700; margin-top: 4px; display: none; }
        .form-group.error .form-control { border-color: var(--danger-600); background-color: var(--danger-100); }
        .form-group.error .error-msg { display: block; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo"><i class="fas fa-user-plus fa-3x"></i></div>
            <h2>Đăng ký Thành viên</h2>
            <p>Tham gia vận hành mạng lưới thiện nguyện minh bạch</p>
        </div>

        {% if messages %}
            {% for message in messages %}
            <div class="msg-box" style="{% if 'success' in message.tags %} background:var(--success-100); color:var(--success-600); border:1px solid var(--success-600); {% else %} background:var(--danger-100); color:var(--danger-600); border:1px solid var(--danger-600); {% endif %}">
                <i class="fas {% if 'success' in message.tags %}fa-circle-check{% else %}fa-circle-xmark{% endif %}"></i>
                <span>{{ message }}</span>
            </div>
            {% endfor %}
        {% endif %}

        <form method="post" action="{% url 'admin_panel:dangky' %}">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label">Họ và tên</label>
                <input type="text" name="fullname" class="form-control w-100" placeholder="Họ và tên của bạn" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Tên đăng nhập (Username)</label>
                <input type="text" name="username" class="form-control w-100" placeholder="Tên tài khoản" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Địa chỉ Email</label>
                <input type="email" name="email" class="form-control w-100" placeholder="email@vi-du.com" required>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label">Mật khẩu</label>
                    <input type="password" name="password" class="form-control w-100" placeholder="••••••••" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Xác nhận</label>
                    <input type="password" name="confirm_password" class="form-control w-100" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">XÁC NHẬN ĐĂNG KÝ</button>
        </form>

        <div class="auth-footer">
            Đã có tài khoản? <a href="{% url 'admin_panel:dangnhap' %}">Đăng nhập ngay</a>
        </div>
    </div>
</body>
</html>
