{% load static %}
{% load humanize %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Quỹ Nhân Ái Admin{% endblock %}</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            /* Primary Brand Colors - Navy Trust */
            --primary-950: #0a1628;
            --primary-900: #0f2044;
            --primary-800: #1e3a8a;
            --primary-700: #2a4fa3;
            --primary-600: #3b6ac7;
            --primary-500: #4f84e0;
            --primary-400: #7aaaf0;
            --primary-300: #a8c5f8;
            --primary-200: #d0e2fd;
            --primary-100: #e8f1fe;
            --primary-50: #f3f7ff;

            /* Accent Colors - Action Orange */
            --accent-600: #ea580c;
            --accent-500: #f97316;
            --accent-400: #fb923c;
            --accent-100: #fff7ed;

            /* Semantic Colors */
            --success-600: #16a34a;
            --success-100: #f0fdf4;
            --danger-600: #dc2626;
            --danger-100: #fef2f2;
            --warning-600: #ca8a04;
            --warning-100: #fefce8;

            /* Neutral Colors */
            --neutral-900: #111827;
            --neutral-700: #374151;
            --neutral-500: #6b7280;
            --neutral-300: #d1d5db;
            --neutral-100: #f9fafb;
            --white: #ffffff;

            /* UI constants */
            --radius-md: 10px;
            --radius-lg: 16px;
            --shadow-sm: 0 1px 2px rgba(15, 32, 68, 0.05);
            --shadow-md: 0 4px 12px rgba(15, 32, 68, 0.08);
            --shadow-lg: 0 8px 32px rgba(15, 32, 68, 0.12);
            --shadow-btn: 0 4px 14px rgba(30, 58, 138, 0.25);
            --font-sans: 'Be Vietnam Pro', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--primary-50) 0%, var(--primary-100) 100%);
            font-family: var(--font-sans);
            color: var(--neutral-900);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        .auth-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--primary-100);
            width: 100%;
            max-width: 460px;
            padding: 48px;
            position: relative;
            overflow: hidden;
        }

        .auth-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px;
            background: var(--primary-800);
        }

        .auth-logo { color: var(--primary-800); text-align: center; margin-bottom: 24px; }
        .auth-header h2 { color: var(--primary-950); font-weight: 800; font-size: 26px; text-align: center; margin-bottom: 8px; letter-spacing: -0.5px; }
        .auth-header p { color: var(--neutral-500); font-size: 15px; text-align: center; margin-bottom: 32px; font-weight: 500; }

        .form-label { font-size: 12px; font-weight: 800; color: var(--neutral-700); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .form-control {
            padding: 12px 16px; border-radius: var(--radius-md); border: 1.5px solid var(--primary-100);
            background: var(--neutral-50); font-size: 15px; transition: all 0.2s;
        }
        .form-control:focus {
            outline: none; border-color: var(--primary-600); background: var(--white);
            box-shadow: 0 0 0 4px var(--primary-100);
        }

        .btn-submit {
            background: var(--primary-800); color: var(--white); border: none; border-radius: var(--radius-md);
            padding: 14px; width: 100%; font-weight: 700; font-size: 16px; margin-top: 16px;
            box-shadow: var(--shadow-btn); transition: all 0.3s;
        }
        .btn-submit:hover { background: var(--primary-900); transform: translateY(-1px); box-shadow: var(--shadow-lg); }

        .msg-box {
            padding: 12px 16px; border-radius: var(--radius-md); margin-bottom: 24px;
            font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 12px;
        }

        .auth-footer { text-align: center; margin-top: 32px; font-size: 14px; color: var(--neutral-500); }
        .auth-footer a { color: var(--primary-700); font-weight: 700; text-decoration: none; }
        .auth-footer a:hover { text-decoration: underline; color: var(--primary-900); }

        .divider { display: flex; align-items: center; text-align: center; margin: 24px 0; color: var(--neutral-400); font-size: 12px; font-weight: 700; text-transform: uppercase; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--primary-100); }
        .divider:not(:empty)::before { margin-right: 1em; }
        .divider:not(:empty)::after { margin-left: 1em; }

        .btn-google {
            width: 100%; padding: 12px; background: var(--white); border: 1.5px solid var(--primary-100);
            border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; gap: 12px;
            color: var(--neutral-700); font-weight: 600; font-size: 14px; text-decoration: none !important; transition: 0.2s;
        }
        .btn-google:hover { background: var(--primary-50); border-color: var(--primary-200); }
    </style>
    <!-- --- Global Loading Overlay --- -->
    <style>
        #global-loader {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.4s ease, visibility 0.4s;
        }
        #global-loader.hidden {
            opacity: 0;
            visibility: hidden;
        }
        .loader-container {
            position: relative;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .loader-logo {
            font-size: 2.2rem;
            color: var(--primary-800);
            z-index: 2;
            animation: heartBeat 1.5s ease-in-out infinite;
        }
        .loader-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid transparent;
            border-top-color: var(--primary-800);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .loader-ring-outer {
            position: absolute;
            width: 130%;
            height: 130%;
            border: 1.5px solid transparent;
            border-bottom-color: var(--primary-200);
            border-radius: 50%;
            animation: spinReverse 1.5s linear infinite;
            opacity: 0.5;
        }
        .loader-text {
            margin-top: 25px;
            font-weight: 700;
            color: var(--primary-900);
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 10px;
            text-align: center;
        }
        @keyframes heartBeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.15); }
            28% { transform: scale(1); }
            42% { transform: scale(1.15); }
            70% { transform: scale(1); }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes spinReverse {
            to { transform: rotate(-360deg); }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- --- Global Loading Overlay --- -->
    <div id="global-loader">
        <div class="loader-container">
            <div class="loader-ring-outer"></div>
            <div class="loader-ring"></div>
            <i class="fas fa-shield-heart loader-logo"></i>
        </div>
        <div class="loader-text">ĐANG TẢI DỮ LIỆU...</div>
    </div>

    <div class="auth-card">
        {% block content %}{% endblock %}
    </div>

    <script>
        // Global Loader Handling
        const loader = document.getElementById('global-loader');

        window.showLoader = function() {
            if (loader) {
                loader.style.display = 'flex';
                // Force reflow
                loader.offsetHeight;
                loader.classList.remove('hidden');
            }
        };

        window.hideLoader = function() {
            if (loader) {
                loader.classList.add('hidden');
                setTimeout(() => {
                    loader.style.display = 'none';
                }, 400);
            }
        };

        window.addEventListener('load', function() {
            window.hideLoader();
        });

        // Hide loader when page is restored from bfcache (browser back/forward)
        window.addEventListener('pageshow', function(event) {
            if (event.persisted) {
                window.hideLoader();
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            // --- Show loader on internal link clicks ---
            document.addEventListener('click', function(e) {
                const link = e.target.closest('a');
                if (!link) return;

                const href = link.getAttribute('href');
                const target = link.getAttribute('target');

                if (href && 
                    !href.startsWith('#') && 
                    !href.startsWith('javascript:') && 
                    !href.startsWith('mailto:') && 
                    !href.startsWith('tel:') &&
                    target !== '_blank' &&
                    !e.ctrlKey && !e.metaKey && !e.shiftKey) {
                    
                    window.showLoader();
                }
            });

            // --- Show loader on form submits ---
            document.addEventListener('submit', function(e) {
                const form = e.target;
                if (!form.classList.contains('no-loader') && form.getAttribute('target') !== '_blank') {
                    window.showLoader();
                }
            });
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
