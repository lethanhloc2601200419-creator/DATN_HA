{% extends 'client/base_client.html' %} {% load static %}
{% load humanize %}

{% block content %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
    /* CSS cho bản đồ hiển thị đẹp */
    #charity_map {
        width: 100%;
        height: 80vh; /* Cao bằng 80% màn hình thiết bị */
        border-radius: 15px;
        box-shadow: 0 0 20px rgba(0,0,0,0.1);
        z-index: 1;
    }
    
    /* CSS cho cái bong bóng popup khi bấm vào */
    .map-popup-card {
        text-align: center;
        width: 200px;
    }
    .map-popup-img {
        width: 100%;
        height: 120px;
        object-fit: cover;
        border-radius: 8px;
        margin-bottom: 8px;
    }
    .map-popup-title {
        font-weight: bold;
        font-size: 14px;
        margin-bottom: 5px;
        display: block;
        color: #d9534f; /* Màu đỏ thương hiệu */
        text-decoration: none;
    }
    .leaflet-popup-content-wrapper {
        border-radius: 10px;
        overflow: hidden;
    }
</style>

<div class="container-fluid py-5 bg-light">
    <div class="container">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-primary">📍 Bản Đồ Hành Trình Thiện Nguyện</h2>
            <p class="text-muted">Nơi dấu chân yêu thương của chúng ta đã đi qua.</p>
        </div>

        <div id="charity_map"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        // 1. Lấy dữ liệu từ Python gửi sang (được nén trong biến JSON)
        var locations = JSON.parse('{{ map_data_json|escapejs }}');

        // 2. Khởi tạo bản đồ (Mặc định nhìn cả Việt Nam)
        var map = L.map('charity_map').setView([16.047079, 108.206230], 6);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // 3. Tạo một nhóm (FeatureGroup) để chứa tất cả các điểm
        // Mục đích: Để sau khi vẽ xong, bản đồ tự zoom vừa khít tất cả các điểm
        var markersGroup = new L.FeatureGroup();

        // 4. Lặp qua danh sách và vẽ từng điểm
        locations.forEach(function(loc) {
            // Nội dung HTML trong cái bong bóng popup
            var popupContent = `
                <div class="map-popup-card">
                    <img src="${loc.image}" class="map-popup-img">
                    <a href="${loc.url}" class="map-popup-title">${loc.name}</a>
                    <p class="small text-muted mb-2"><i class="fas fa-map-marker-alt"></i> ${loc.address}</p>
                    <a href="${loc.url}" class="btn btn-sm btn-danger w-100">Xem chi tiết & Ủng hộ</a>
                </div>
            `;

            // Tạo Marker và gán sự kiện click
            var marker = L.marker([loc.lat, loc.lng])
                .bindPopup(popupContent);
            
            markersGroup.addLayer(marker); // Thêm vào nhóm
        });

        // 5. Thêm nhóm vào bản đồ
        map.addLayer(markersGroup);

        // 6. Tự động Zoom bản đồ sao cho nhìn thấy hết tất cả các điểm
        if (locations.length > 0) {
            map.fitBounds(markersGroup.getBounds().pad(0.1)); // pad(0.1) để lùi ra một chút cho thoáng
        }
    });
</script>

{% endblock %}
